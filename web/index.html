<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Topple</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Lexend:wght@400;500;600&family=DM+Mono:wght@500&display=swap">
<style>
/* Layout: one-screen toy cabinet. Header strip, the pine-green board centred, a thumb-reach control row underneath. */
:root {
  --page: #E4EAE6;
  --ink: #1D2B29;
  --muted: #5E6F6B;
  --board: #24443F;
  --board-edge: #17302C;
  --cell: #2A4C47;
  --putty: #E3D3B4;
  --putty-edge: #B8A684;
  --hero: #E2513A;
  --hero-edge: #A9351F;
  --ice: #BEE5EC;
  --ice-edge: #7FB8C4;
  --stone: #4D6560;
  --stone-line: #3C524D;
  --gold: #E8B33B;
  --panel: #F6F8F6;
  --panel-line: #CBD6D1;
  --display: "Lilita One", "Arial Rounded MT Bold", system-ui, sans-serif;
  --body: "Lexend", system-ui, -apple-system, sans-serif;
  --mono: "DM Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #111917; --ink: #E6EDEA; --muted: #92A39E;
    --board: #1C3632; --board-edge: #0C1A18; --cell: #22403B;
    --putty: #D6C5A4; --putty-edge: #9D8C6B;
    --hero: #EA5C44; --hero-edge: #A4321D;
    --ice: #A9D9E2; --ice-edge: #6AA3AF;
    --stone: #415853; --stone-line: #33463F;
    --gold: #F0BE4B; --panel: #1A2523; --panel-line: #2E3E3A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #111917; --ink: #E6EDEA; --muted: #92A39E;
  --board: #1C3632; --board-edge: #0C1A18; --cell: #22403B;
  --putty: #D6C5A4; --putty-edge: #9D8C6B;
  --hero: #EA5C44; --hero-edge: #A4321D;
  --ice: #A9D9E2; --ice-edge: #6AA3AF;
  --stone: #415853; --stone-line: #33463F;
  --gold: #F0BE4B; --panel: #1A2523; --panel-line: #2E3E3A;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); box-sizing: border-box; }
body {
  background: var(--page); color: var(--ink); font-family: var(--body);
  overscroll-behavior: none; -webkit-user-select: none; user-select: none;
  touch-action: manipulation;
}
.app {
  height: 100%; box-sizing: border-box; display: grid; grid-template-rows: auto 1fr auto;
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 14px; gap: 10px;
}
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
h1 { font-family: var(--display); font-weight: 400; font-size: 1.9rem; letter-spacing: .01em; margin: 0; line-height: 1; }
h1 span { color: var(--hero); }
.lvl { font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.stats { display: flex; gap: 14px; align-items: baseline; font-variant-numeric: tabular-nums; }
.stat { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.stat b { font-family: var(--mono); font-size: 1.25rem; font-weight: 500; line-height: 1; }
.stat small { font-size: .62rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

.stage { min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
.hint { font-size: .85rem; color: var(--muted); text-align: center; min-height: 1.3em; max-width: 34ch; text-wrap: balance; }
.boardwrap { position: relative; }
.board {
  position: relative; background: var(--board); border-radius: 14px;
  box-shadow: inset 0 0 0 6px var(--board-edge), 0 10px 24px -12px rgba(10,30,26,.55);
  touch-action: none;
}
.cellbg { position: absolute; inset: 6px; border-radius: 9px; overflow: hidden;
  background-image: radial-gradient(circle at center, var(--cell) 22%, transparent 24%);
}
.exit { position: absolute; right: -14px; width: 20px; display: grid; place-items: center; }
.exit::before { content: ""; position: absolute; left: 0; top: 4px; bottom: 4px; width: 8px; background: var(--board); }
.exit svg { position: relative; left: 4px; width: 14px; height: 14px; fill: var(--hero); animation: nudge 1.4s ease-in-out infinite; }
@keyframes nudge { 50% { transform: translateX(3px); } }

.blk { position: absolute; left: 0; top: 0; box-sizing: border-box; border-radius: 9px; will-change: transform; outline: none; }
.blk .face { position: absolute; inset: 0; border-radius: inherit; transform-origin: 50% 100%; }
.blk.n .face { background: var(--putty); box-shadow: inset 0 -5px 0 var(--putty-edge), inset 0 2px 0 rgba(255,255,255,.45); }
.blk.r .face { background: var(--hero); box-shadow: inset 0 -5px 0 var(--hero-edge), inset 0 2px 0 rgba(255,255,255,.35); }
.blk.i .face { background: linear-gradient(135deg, rgba(255,255,255,.7) 0 18%, transparent 18% 30%, rgba(255,255,255,.35) 30% 36%, transparent 36%), var(--ice);
  box-shadow: inset 0 -5px 0 var(--ice-edge), inset 0 0 0 2px rgba(255,255,255,.4); }
.blk.f .face { border-radius: 6px; background: repeating-linear-gradient(-45deg, var(--stone) 0 6px, var(--stone-line) 6px 9px); box-shadow: inset 0 0 0 2px var(--stone-line); }
.blk.mv { cursor: grab; }
.blk.mv:active { cursor: grabbing; }
.blk.mv:focus-visible .face { box-shadow: 0 0 0 3px var(--gold); }
.blk.lift .face { filter: brightness(1.06); }
.blk.land .face { animation: land .26s ease-out; }
@keyframes land { 0% { transform: scale(1.06, .86); } 55% { transform: scale(.98, 1.04); } 100% { transform: none; } }
.eyes { position: absolute; inset: 0; display: flex; justify-content: center; align-items: center; gap: 18%; padding-bottom: 4px; }
.eye { width: 22%; max-width: 15px; aspect-ratio: 1; background: #fff; border-radius: 50%; position: relative; }
.eye::after { content: ""; position: absolute; width: 50%; height: 50%; border-radius: 50%; background: #2A1410; top: 25%; left: calc(25% + var(--look, 0) * 20%); transition: left .15s; }
.blk.r.win { transition: transform .5s cubic-bezier(.5,0,.8,.4), opacity .5s !important; opacity: 0; }

.controls { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
button.ctl {
  font: 600 .9rem var(--body); color: var(--ink); background: var(--panel); border: 1px solid var(--panel-line);
  border-radius: 999px; padding: 11px 18px; display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
}
button.ctl svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
button.ctl:disabled { opacity: .4; cursor: default; }
button.ctl:focus-visible, button.go:focus-visible, .lv:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

.overlay { position: fixed; inset: 0; display: grid; place-items: center; background: color-mix(in srgb, var(--page) 70%, transparent);
  backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); z-index: 20;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.card { background: var(--panel); border: 1px solid var(--panel-line); border-radius: 18px; padding: 22px 22px 20px; width: min(340px, 100%); box-sizing: border-box;
  display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; box-shadow: 0 20px 40px -20px rgba(0,0,0,.4); }
.card h2 { font-family: var(--display); font-weight: 400; font-size: 1.8rem; margin: 0; line-height: 1.1; }
.card p { margin: 0; color: var(--muted); font-size: .9rem; }
.stars { display: flex; gap: 6px; }
.stars svg { width: 42px; height: 42px; fill: var(--panel-line); }
.stars svg.on { fill: var(--gold); animation: pop .4s backwards; }
.stars svg.on:nth-child(2) { animation-delay: .12s; } .stars svg.on:nth-child(3) { animation-delay: .24s; }
@keyframes pop { 0% { transform: scale(0); } 70% { transform: scale(1.2); } }
button.go { font: 400 1.2rem var(--display); letter-spacing: .02em; background: var(--hero); color: #fff; border: 0; border-radius: 999px; padding: 12px 26px; cursor: pointer; box-shadow: inset 0 -4px 0 var(--hero-edge); }
button.link { background: none; border: 0; color: var(--muted); font: 500 .85rem var(--body); cursor: pointer; padding: 4px; text-decoration: underline; text-underline-offset: 3px; }
.grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; width: 100%; }
.lv { aspect-ratio: 1; border-radius: 12px; border: 1px solid var(--panel-line); background: var(--page); color: var(--ink); font: 400 1.25rem var(--display);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer; padding: 0; }
.lv small { font: 500 .55rem var(--mono); color: var(--gold); letter-spacing: .05em; min-height: 1em; }
.lv:disabled { opacity: .35; cursor: default; }
.lv.cur { border-color: var(--hero); box-shadow: inset 0 0 0 1px var(--hero); }
@media (prefers-reduced-motion: reduce) { .exit svg, .stars svg.on { animation: none; } .blk.land .face { animation: none; } }
</style>
</head>
<body>

<div class="app">
  <header>
    <div>
      <h1>Top<span>ple</span></h1>
      <div class="lvl" id="lvlLabel">Razina 1 od 10</div>
    </div>
    <div class="stats">
      <div class="stat"><b id="mv">0</b><small>Potezi</small></div>
      <div class="stat"><b id="par">2</b><small>Cilj</small></div>
    </div>
  </header>
  <main class="stage" id="stage">
    <div class="boardwrap"><div class="board" id="board"><div class="cellbg"></div></div></div>
    <div class="hint" id="hint"></div>
  </main>
  <div class="controls">
    <button class="ctl" id="undo" type="button"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>Vrati</button>
    <button class="ctl" id="reset" type="button"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>Ponovi</button>
    <button class="ctl" id="levels" type="button"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg>Razine</button>
    <button class="ctl" id="snd" type="button" aria-label="Zvuk"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path id="sndWave" d="M16.5 8.5a5 5 0 0 1 0 7"/></svg></button>
  </div>
</div>

<div class="overlay" id="winBox" hidden>
  <div class="card">
    <div class="stars" id="stars"></div>
    <h2 id="winTitle">Izašao je!</h2>
    <p id="winText"></p>
    <button class="go" id="next" type="button">Sljedeća razina</button>
    <button class="link" id="retry" type="button">Pokušaj u manje poteza</button>
  </div>
</div>
<div class="overlay" id="lvBox" hidden>
  <div class="card">
    <h2>Razine</h2>
    <div class="grid" id="lvGrid"></div>
    <button class="link" id="lvClose" type="button">Zatvori</button>
  </div>
</div>

<script src="core.js"></script>
<script src="levels.js"></script>
<script>
const HINTS = {
  0: 'Povuci blok lijevo ili desno. Sve iznad njega padne. Dovedi crveni do izlaza.',
  1: 'Ponekad prvo treba maknuti blok koji nije na putu.',
  2: 'Kameni blokovi se ne miču i ne padaju.',
  5: 'Novo: led. Kad ga gurneš, klizi dok ne udari u nešto.',
};
const STAR = '<svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z"/></svg>';
const $ = id => document.getElementById(id);
const board = $('board');
let lvl = 0, blocks = [], hist = [], els = [], cell = 40, busy = false, won_ = false, soundOn = true, ac = null;
let best = {};
try { best = JSON.parse(localStorage.getItem('topple-best') || '{}'); } catch (e) {}
const saveBest = () => { try { localStorage.setItem('topple-best', JSON.stringify(best)); } catch (e) {} };
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const PAD = 6, GAP = 3;

function starsFor(m, opt) { return m <= opt ? 3 : m <= opt + 2 ? 2 : 1; }
function unlocked(i) { return i === 0 || best[i - 1] > 0; }

function tone(freq, dur, type = 'sine', vol = .25) {
  if (!soundOn) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, ac.currentTime);
    o.frequency.exponentialRampToValueAtTime(freq * .55, ac.currentTime + dur);
    g.gain.setValueAtTime(vol, ac.currentTime); g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + dur);
    o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + dur);
  } catch (e) {}
}
const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

function layout() {
  const st = $('stage');
  const availW = st.clientWidth - 24, availH = st.clientHeight - 40;
  cell = Math.max(28, Math.floor(Math.min((availW - PAD * 2) / W, (availH - PAD * 2) / H, 64)));
  board.style.width = cell * W + PAD * 2 + 'px';
  board.style.height = cell * H + PAD * 2 + 'px';
  const L = LEVELS[lvl];
  const ex = board.querySelector('.exit');
  ex.style.top = PAD + L.exit * cell + 'px'; ex.style.height = cell + 'px';
  els.forEach((el, i) => {
    el.style.width = blocks[i].w * cell - GAP * 2 + 'px';
    el.style.height = cell - GAP * 2 + 'px';
  });
  place(0);
}
function pos(b, dx = 0) { return `translate(${PAD + GAP + (b.x + dx) * cell}px, ${PAD + GAP + b.y * cell}px)`; }
function place(ms, only) {
  els.forEach((el, i) => {
    if (only && !only.includes(i)) return;
    el.style.transition = ms ? `transform ${ms}ms cubic-bezier(.3,.7,.4,1)` : 'none';
    el.style.transform = pos(blocks[i]);
  });
}

function load(i, keep) {
  lvl = i; won_ = false; busy = false;
  const L = LEVELS[i];
  blocks = keep ? keep.blocks : L.blocks.map(([x, y, w, t]) => ({ x, y, w, t }));
  hist = keep ? keep.hist : [];
  board.querySelectorAll('.blk, .exit').forEach(e => e.remove());
  const ex = document.createElement('div'); ex.className = 'exit';
  ex.innerHTML = '<svg viewBox="0 0 10 10"><path d="M2 1l6 4-6 4z"/></svg>';
  board.appendChild(ex);
  els = blocks.map((b, k) => {
    const el = document.createElement('div');
    el.className = 'blk ' + b.t + (b.t !== 'f' ? ' mv' : '');
    el.innerHTML = '<div class="face"></div>' + (b.t === 'r' ? '<div class="eyes"><span class="eye"></span><span class="eye"></span></div>' : '');
    if (b.t !== 'f') {
      el.tabIndex = 0;
      el.setAttribute('role', 'button');
      el.setAttribute('aria-label', { r: 'Crveni blok', n: 'Blok', i: 'Ledeni blok' }[b.t] + ', strelicama lijevo i desno');
      el.addEventListener('pointerdown', e => grab(e, k));
      el.addEventListener('keydown', e => onKey(e, k));
    }
    board.appendChild(el);
    return el;
  });
  $('lvlLabel').textContent = `Razina ${i + 1} od ${LEVELS.length}`;
  $('par').textContent = L.opt;
  $('hint').textContent = HINTS[i] || '';
  $('winBox').hidden = true;
  update();
  layout();
}
function update() {
  $('mv').textContent = hist.length;
  $('undo').disabled = !hist.length || won_;
}

function grab(e, k) {
  if (busy || won_) return;
  e.preventDefault();
  const el = els[k], b = blocks[k];
  const [l, r] = range(blocks, k);
  const x0 = e.clientX;
  el.setPointerCapture(e.pointerId);
  el.classList.add('lift');
  el.style.transition = 'none';
  let dx = 0;
  const onMove = ev => {
    dx = Math.max(-l, Math.min(r, (ev.clientX - x0) / cell));
    el.style.transform = pos(b, dx);
    if (b.t === 'r') el.style.setProperty('--look', Math.sign(dx));
  };
  const onUp = () => {
    el.removeEventListener('pointermove', onMove);
    el.removeEventListener('pointerup', onUp);
    el.removeEventListener('pointercancel', onUp);
    el.classList.remove('lift');
    let d = b.t === 'i' ? (dx > .3 ? r : dx < -.3 ? -l : 0) : Math.round(dx);
    if (!d) { place(140, [k]); return; }
    commit(k, d, Math.abs(d - dx));
  };
  el.addEventListener('pointermove', onMove);
  el.addEventListener('pointerup', onUp);
  el.addEventListener('pointercancel', onUp);
}
function onKey(e, k) {
  if (busy || won_) return;
  const dir = e.key === 'ArrowLeft' ? -1 : e.key === 'ArrowRight' ? 1 : 0;
  if (!dir) return;
  e.preventDefault();
  const [l, r] = range(blocks, k);
  const max = dir < 0 ? l : r;
  if (!max) return;
  commit(k, blocks[k].t === 'i' ? dir * max : dir, 1);
}

function commit(k, d, travel) {
  busy = true;
  hist.push(blocks.map(b => ({ ...b })));
  blocks[k].x += d;
  const slideMs = reduced ? 60 : Math.round(90 + 70 * Math.min(travel, 3));
  place(slideMs, [k]);
  tone(blocks[k].t === 'i' ? 900 : 520, .05, 'triangle', .08);
  update();
  setTimeout(() => fall(), slideMs);
}
function fall() {
  const before = blocks.map(b => b.y);
  settle(blocks);
  let maxMs = 0;
  const landed = [];
  els.forEach((el, i) => {
    const dist = blocks[i].y - before[i];
    if (!dist) return;
    const ms = reduced ? 80 : Math.round(150 * Math.sqrt(dist));
    maxMs = Math.max(maxMs, ms);
    el.style.transition = `transform ${ms}ms cubic-bezier(.55,0,1,.6)`;
    el.style.transform = pos(blocks[i]);
    landed.push([i, ms]);
  });
  landed.forEach(([i, ms]) => setTimeout(() => {
    els[i].classList.remove('land'); void els[i].offsetWidth; els[i].classList.add('land');
  }, ms));
  if (landed.length) setTimeout(() => { tone(110, .16, 'sine', .3); buzz(12); }, maxMs);
  setTimeout(() => {
    busy = false;
    const ri = blocks.findIndex(b => b.t === 'r');
    els[ri].style.setProperty('--look', 0);
    if (won(blocks, LEVELS[lvl].exit)) win();
  }, maxMs + 20);
}
function win() {
  won_ = true; update();
  const ri = blocks.findIndex(b => b.t === 'r'), el = els[ri];
  el.style.setProperty('--look', 1);
  el.classList.add('win');
  el.style.transform = pos(blocks[ri], 2.5);
  [523, 659, 784].forEach((f, j) => setTimeout(() => tone(f, .22, 'triangle', .14), 120 + j * 110));
  buzz([10, 40, 10]);
  const opt = LEVELS[lvl].opt, m = hist.length, s = starsFor(m, opt);
  best[lvl] = Math.max(best[lvl] || 0, s); saveBest();
  setTimeout(() => {
    $('stars').innerHTML = [0, 1, 2].map(j => STAR.replace('<svg', `<svg class="${j < s ? 'on' : ''}"`)).join('');
    $('winTitle').textContent = s === 3 ? 'Savršeno!' : 'Izašao je!';
    $('winText').textContent = s === 3 ? `${m} ${m === 1 ? 'potez' : 'poteza'}, točno koliko treba.`
      : `${m} poteza. Može i u ${opt}.`;
    $('retry').hidden = s === 3;
    const last = lvl === LEVELS.length - 1;
    $('next').textContent = last ? 'Sve razine' : 'Sljedeća razina';
    $('winBox').hidden = false;
    $('next').focus({ preventScroll: true });
  }, 650);
}

function openLevels() {
  $('lvGrid').innerHTML = LEVELS.map((L, i) =>
    `<button class="lv${i === lvl ? ' cur' : ''}" type="button" data-i="${i}" ${unlocked(i) ? '' : 'disabled'}>${i + 1}<small>${best[i] ? '★'.repeat(best[i]) : ''}</small></button>`).join('');
  $('lvBox').hidden = false;
}
$('lvGrid').addEventListener('click', e => { const b = e.target.closest('.lv'); if (b && !b.disabled) { $('lvBox').hidden = true; load(+b.dataset.i); } });
$('lvClose').onclick = () => { $('lvBox').hidden = true; };
$('levels').onclick = openLevels;
$('undo').onclick = () => { if (busy || !hist.length || won_) return; blocks.splice(0, blocks.length, ...hist.pop()); place(160); update(); tone(330, .05, 'triangle', .06); };
$('reset').onclick = () => { if (busy) return; load(lvl); };
$('retry').onclick = () => load(lvl);
$('next').onclick = () => { if (lvl === LEVELS.length - 1) { $('winBox').hidden = true; openLevels(); } else load(lvl + 1); };
$('snd').onclick = () => { soundOn = !soundOn; $('sndWave').style.display = soundOn ? '' : 'none'; if (soundOn) tone(520, .06, 'triangle', .1); };
addEventListener('resize', () => layout());

function start(data) {
  let i = 0;
  for (let k = 0; k < LEVELS.length; k++) if (unlocked(k)) i = k;
  if (data && typeof data.lvl === 'number') load(data.lvl, data.blocks ? { blocks: data.blocks, hist: data.hist || [] } : null);
  else load(i);
}
start({});
</script>
</body>
</html>
