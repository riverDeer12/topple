# Xcode project for the Topple iOS app, generated with XcodeGen (see ios/README.md):
#   brew install xcodegen && cd ios && xcodegen
# The app is a native shell around the web game in ../web, which is copied into the app
# bundle at build time, so every change to the web game is in the next app build too.
name: Topple
options:
  bundleIdPrefix: software.rdd
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: hr
settings:
  base:
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "3"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""        # your Apple team ID (Xcode → Signing & Capabilities), or set it there
    GOOGLE_IOS_CLIENT_ID: "224195062999-lqe0avqbcb952jbus9tu23nsfu05jv3l.apps.googleusercontent.com"
    # AdMob (rewarded ads for hints): Google's test IDs until the real iOS app and ad unit IDs
    # from the AdMob account (Apps → Topple iOS) are put here.
    ADMOB_APP_ID: "ca-app-pub-3940256099942544~1458002511"
    ADMOB_REWARDED_ID: "ca-app-pub-3940256099942544/1712485313"
packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: 12.0.0
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform.git
    from: 3.0.0
targets:
  Topple:
    type: application
    platform: iOS
    sources:
      - path: Topple
      - path: ../web
        type: folder
        buildPhase: resources
    dependencies:
      - package: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
    info:
      path: Topple/Info.plist
      properties:
        CFBundleDisplayName: Topple
        CFBundleDevelopmentRegion: hr
        CFBundleLocalizations: [hr, en, it, de]
        UILaunchScreen:
          UIColorName: PageBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown]
        UIRequiresFullScreen: true
        UIStatusBarStyle: UIStatusBarStyleDefault
        ITSAppUsesNonExemptEncryption: false
        GKGameCenterBadgingDisabled: false
        GoogleIOSClientID: $(GOOGLE_IOS_CLIENT_ID)
        GADApplicationIdentifier: $(ADMOB_APP_ID)
        ToppleRewardedAdUnit: $(ADMOB_REWARDED_ID)
        NSUserTrackingUsageDescription: "Reklame za dodatne savjete mogu biti prilagođene tebi. Topple ne prati što radiš u drugim aplikacijama."
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
    entitlements:
      path: Topple/Topple.entitlements
      properties:
        com.apple.developer.game-center: true
        com.apple.developer.applesignin: [Default]
    scheme:
      storeKitConfiguration: Topple.storekit   # local test purchases in Xcode (not used by TestFlight or the App Store)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: software.rdd.topple
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: NO
